info:
  name: add image
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:4000/api/food/add
  auth: inherit
  body:
    type: multipartForm
    data:
      - name: name
        type: text
        value: Test food
      - name: description
        type: text
        value: Test description
      - name: price
        type: text
        value: "10"
      - name: category
        type: text
        value: Salad
      - name: image
        type: file
        path: ./food_5.png

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
